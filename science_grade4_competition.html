<script id="quiz-data" type="application/json">[{"id":1,"type":"mcq","classification":"مباشر","concept":"الجهاز الدوراني ووظيفة القلب","text":"أي عضو يضخ الدم إلى جميع أجزاء الجسم؟","options":["الرئة","القلب","الكلية","المعدة"],"correct":1,"points":1,"explanation":"القلب عضلة قوية تضخ الدم إلى جميع أجزاء الجسم.","source":"فقرة الجهاز الدوراني في الصورة التي تضم رسمَي السمكة والأرنب، عند وصف وظيفة القلب."},{"id":2,"type":"mcq","classification":"استنتاج وتحليل","concept":"تعاون الجهاز الهيكلي والجهاز العضلي في الحركة","text":"تخيّل أن عظام ساق حيوان سليمة، لكن العضلات التي تحرّكها لا تعمل. أي نتيجة تتوقع؟","options":["تبقى حركة الساق كما هي دون عمل العضلات.","يتوقف وصول الطعام إلى المعدة عند الحيوان.","تتوقف الرئتان عن تبادل الغازات عند الحيوان.","تتأثر حركة الساق رغم سلامة عظام الحيوان."],"correct":3,"points":1,"explanation":"العضلات تحرّك العظام، ويعمل الجهاز الهيكلي مع الجهاز العضلي في الحركة؛ لذلك تتأثر حركة الساق عند تعطل عضلاتها.","source":"فقرة الجهاز الهيكلي والجهاز العضلي في صورة كيف تتحرك الحيوانات وكيف تحس بالتغيرات، عند تعاون الجهازين وتحريك العضلات للعظام."},{"id":3,"type":"mcq","classification":"مباشر","concept":"الجهاز العصبي والتحكم في أجهزة الجسم","text":"أي جهاز يتحكم في جميع أجهزة الجسم؟","options":["الجهاز العصبي","الجهاز الهضمي","الجهاز التنفسي","الجهاز الإخراجي"],"correct":0,"points":1,"explanation":"الجهاز العصبي هو الجهاز الذي يتحكم في جميع أجهزة الجسم.","source":"بداية فقرة الجهاز العصبي في الصورة المصحوبة بالبومة."},{"id":4,"type":"mcq","classification":"استنتاج وتحليل","concept":"التكامل بين الجهاز التنفسي والجهاز الدوراني","text":"انتقل الأكسجين إلى دم حيوان، لكن الدم لم يصل إلى بعض خلاياه. ما النتيجة المتوقعة لهذه الخلايا؟","options":["تستقبل الأكسجين بكميته المعتادة من الدم.","تستقبل الأكسجين لأن العظام تنقله إليها.","يتعطل وصول الأكسجين إليها عن طريق الدم.","يزداد وصول الأكسجين إليها عند توقف الدم."],"correct":2,"points":1,"explanation":"ينقل الجهاز التنفسي الأكسجين إلى الدم، ويحمل الدم الأكسجين إلى الخلايا. إذا لم يصل الدم إلى بعض الخلايا، تعطل وصول الأكسجين إليها بهذا الطريق.","source":"فقرة الجهاز التنفسي عند نقل الأكسجين إلى الدم، وفقرة الجهاز الدوراني عند حمل الدم الأكسجين إلى خلايا الجسم."},{"id":5,"type":"mcq","classification":"مباشر","concept":"الجهاز الإخراجي ووظيفة المثانة","text":"أي عضو يخزّن الفضلات السائلة؟","options":["الكبد","المثانة","الجلد","الرئة"],"correct":1,"points":1,"explanation":"تخزّن المثانة الفضلات السائلة.","source":"فقرة الجهاز الإخراجي في الصورة التي تضم رسمَي السمكة والأرنب، عند وصف وظيفة المثانة."},{"id":6,"type":"mcq","classification":"استنتاج وتحليل","concept":"تحليل الطعام في الأمعاء الدقيقة ونقله بالدم","text":"وصل الطعام إلى الأمعاء الدقيقة، لكنها لم تحلّله إلى مواد أصغر. أي عملية يُتوقّع أن تصبح أصعب؟","options":["نقل الدم مواد الطعام إلى أجزاء الجسم.","تخزين المثانة الفضلات السائلة في الجسم.","إخراج الجلد الأملاح الزائدة مع العرق.","نقل الجهاز التنفسي الأكسجين إلى الدم."],"correct":0,"points":1,"explanation":"تحلّل الأمعاء الدقيقة الطعام إلى مواد أصغر ليسهل على الدم نقلها إلى جميع أجزاء الجسم؛ لذلك يصعب هذا النقل إذا لم يتم التحليل.","source":"فقرة كيف يهضم الطعام في الصورة المصحوبة بالسلحفاة، عند دور الأمعاء الدقيقة في تحليل الطعام ليسهل نقله بالدم."},{"id":7,"type":"mcq","classification":"مباشر","concept":"الجهاز التنفسي والتخلص من الفضلات الغازية","text":"ما الفضلات التي يساعد الجهاز التنفسي على تخليص الدم منها؟","options":["مواد الطعام","الأملاح الزائدة","الفضلات السائلة","ثاني أكسيد الكربون"],"correct":3,"points":1,"explanation":"ورد أن الجهاز التنفسي يساعد على تخليص الدم من الفضلات الضارة، ومنها غاز ثاني أكسيد الكربون.","source":"فقرة الجهاز التنفسي في صورة كيف ينتقل الدم والغازات في جسم الحيوانات، عند ذكر غاز ثاني أكسيد الكربون."},{"id":8,"type":"mcq","classification":"استنتاج وتحليل","concept":"اختلاف أعضاء التنفس واستخدام الدليل لتصحيح تعميم","text":"قال طالب: «كل الحيوانات تتنفس بالرئتين». أي دليل من الصفحات يصحّح فكرته؟","options":["يتنفس الأرنب بالرئتين كما يظهر في الرسم.","ينقل الدم الغذاء والأكسجين إلى خلايا الجسم.","تتنفس السمكة بالخياشيم كما يظهر في الرسم.","تحلّل الأمعاء الدقيقة الطعام إلى مواد أصغر."],"correct":2,"points":1,"explanation":"يبين رسم السمكة وجود الخياشيم، وتوضح فقرة الجهاز التنفسي أن الخياشيم والرئات أعضاء للتنفس. وجود حيوان يتنفس بالخياشيم يصحّح تعميم التنفس بالرئتين.","source":"رسم الخياشيم في السمكة ورسم الرئة في الأرنب، مع نهاية فقرة الجهاز التنفسي التي تذكر الخياشيم والرئات."},{"id":9,"type":"list","classification":"تعداد","concept":"الجهاز العصبي والحواس","text":"عدّد حاستين يساعد الجهاز العصبي الحيوان على استخدامهما.","accepted":["السمع","النظر أو البصر","التذوق","اللمس","الشم"],"points":2,"explanation":"تذكر الفقرة أن الجهاز العصبي وأعضاء الحس تساعد على السمع والنظر والتذوق واللمس والشم.","rubric":"تُقبل أي حاستين مختلفتين من القائمة. درجة لكل حاسة صحيحة، وبحد أقصى درجتين. لا يُحسب النظر والبصر عنصرين مختلفين.","source":"فقرة الجهاز العصبي في الصورة المصحوبة بالبومة، عند تعداد الحواس."},{"id":10,"type":"list","classification":"تعداد","concept":"أعضاء الجهاز الهضمي والتعرف إلى تسميات الرسم","text":"عدّد عضوين من أعضاء الجهاز الهضمي.","accepted":["الفم","المريء","المعدة","الأمعاء الدقيقة"],"points":2,"explanation":"تظهر هذه الأعضاء بأسمائها في رسم الجهاز الهضمي للسلحفاة.","rubric":"يُقبل أي عضوين مختلفين من القائمة. درجة لكل عضو صحيح، وبحد أقصى درجتين.","source":"رسم الجهاز الهضمي للسلحفاة في صورة كيف يهضم الطعام، وتسميات الفم والمريء والمعدة والأمعاء الدقيقة."}]</script>
<script>
(()=>{'use strict';
const questions=JSON.parse(document.getElementById('quiz-data').textContent);
const letters=['أ','ب','ج','د'];
const storageKey='science-grade4-classroom-v1';
const app=document.getElementById('app');
const resetButton=document.getElementById('reset');
const overlay=document.getElementById('reset-overlay');
const ar=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let game=null,pendingChoice=null,pendingTeam='',pendingGrade=null,clock=null,seconds=60,running=false,lastFocus=null;
let setup={mode:'teams',count:2,names:['الفريق الأول','الفريق الثاني'],timer:false,duration:60};
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.version===1&&Array.isArray(saved.teams)&&saved.teams.length&&saved.teams.every(t=>typeof t.name==='string'&&t.name.length<=32)&&Array.isArray(saved.answers)&&saved.answers.length===10&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<=10){const valid=saved.answers.every((r,i)=>r===null||(r&&Number.isInteger(r.team)&&r.team>=0&&r.team<saved.teams.length&&['revealed','scored'].includes(r.status)&&(r.status!=='scored'||Number.isInteger(r.score)&&r.score>=0&&r.score<=questions[i].points)));if(valid){game=saved;setup=saved.settings;seconds=setup.duration;}}}catch(e){}
function persist(){try{if(game)localStorage.setItem(storageKey,JSON.stringify(game));else localStorage.removeItem(storageKey);}catch(e){}}
function stopClock(){if(clock)clearInterval(clock);clock=null;running=false;}
function scores(){return game.teams.map((t,id)=>({name:t.name,id,points:game.answers.reduce((n,r)=>n+(r&&r.status==='scored'&&r.team===id?r.score:0),0),answered:game.answers.filter(r=>r&&r.status==='scored'&&r.team===id).length}));}
function currentRecord(){return game.answers[game.index];}
function completed(){return game.answers.filter(r=>r&&r.status==='scored').length;}
function render(){resetButton.hidden=!game;if(!game)renderSetup();else if(game.index>=questions.length)renderResults();else renderQuestion();}
function renderSetup(){
 stopClock();app.innerHTML=`<section class="card setup"><div class="setup-head"><span class="tag">مسابقة صفية بإدارة المعلم</span><h1>تحدّي أجهزة الجسم</h1><p class="intro">عشرة أسئلة نكتشف بها كيف تعمل أجهزة الجسم معًا. تعاونوا، وفكّروا، ثم اختاروا إجابتكم.</p><div class="facts"><span><strong>٨</strong> أسئلة اختيارية</span><span><strong>٢</strong> سؤالا تعداد</span><span><strong>١٢</strong> درجة للمسابقة كلها</span></div></div><div class="setup-body"><form id="setup-form"><fieldset><legend>كيف نلعب اليوم؟</legend><div class="mode-row"><label class="mode-card"><input type="radio" name="mode" value="teams" ${setup.mode==='teams'?'checked':''}><span><strong>بين فرق الصف</strong><small>يحدد المعلم الفريق المجيب لكل سؤال.</small></span></label><label class="mode-card"><input type="radio" name="mode" value="class" ${setup.mode==='class'?'checked':''}><span><strong>مجموعة صفية واحدة</strong><small>يتعاون جميع الطلاب لجمع النقاط.</small></span></label></div></fieldset><div class="team-config" id="team-config"><div class="field-inline"><label for="team-count"><strong>عدد الفرق</strong></label><input class="team-count" type="number" id="team-count" min="2" max="10" step="1" value="${setup.count}" required><span class="note">من فريقين إلى عشرة فرق</span></div><div class="team-fields" id="team-fields"></div></div><div class="timer-config"><label><input type="checkbox" id="timer-enabled" ${setup.timer?'checked':''}>استخدام مؤقت اختياري</label><label id="duration-label" for="timer-duration">المدة بالثواني <input id="timer-duration" type="number" min="10" max="300" step="1" value="${setup.duration}" ${setup.timer?'':'disabled'}></label><span class="note">لا تُخصم نقاط بسبب الوقت.</span></div><p class="note">الاختياري: درجة واحدة. التعداد: درجتان، درجة لكل عنصر صحيح. عند اللعب بالفرق، تُوزّع أسئلة المسابقة ودرجاتها بينها.</p><p class="error" id="setup-error" role="alert" hidden></p><div class="setup-actions"><button class="btn primary" type="submit">لنبدأ المسابقة</button><span class="note">١٠ أسئلة بالترتيب نفسه في النسخة المطبوعة.</span></div></form><details class="help"><summary>تعليمات موجزة للمعلم</summary><ol><li>افتح هذا الملف في متصفح حديث. يعمل محليًا دون إنترنت. اختر طريقة اللعب، ثم أدخل أسماء الفرق.</li><li>حدد الفريق المجيب قبل اعتماد كل سؤال. اختر البديل ثم اضغط «تأكيد الإجابة» لإظهار التصحيح واحتساب النقطة مرة واحدة.</li><li>في سؤالي التعداد، اترك الطلاب يجيبون شفهيًا أو كتابيًا، ثم أظهر نموذج الإجابة وحدد الدرجة من ٠ إلى ٢، واضغط «اعتماد الدرجة».</li><li>لا تحتسب العنصر المكرر مرتين. اقبل الصياغة المكافئة والخطأ الإملائي البسيط الذي لا يغيّر المعنى.</li><li>اضغط «السؤال التالي» بعد التصحيح. تظهر النقاط الفعلية لكل فريق، ثم الفائز أو التعادل في النهاية.</li><li>المؤقت معطل افتراضيًا، ويبدأ بالضغط على زره. انتهاء الوقت لا يمنع الإجابة ولا يخصم نقاطًا. زر إعادة البدء يطلب تأكيدًا.</li></ol><p>تُحفظ الجولة في هذا المتصفح عندما يسمح بالحفظ المحلي. هذا الملف مخصص لإدارة المعلم، ويمكن الاطلاع على الإجابات من شفرته.</p></details></div></section>`;
 const count=document.getElementById('team-count');
 function fields(){const fields=document.getElementById('team-fields');fields.querySelectorAll('input').forEach((el,i)=>setup.names[i]=el.value);const value=Number(count.value);if(Number.isInteger(value)&&value>=2&&value<=10)setup.count=value;fields.innerHTML=Array.from({length:setup.count},(_,i)=>`<label>اسم الفريق ${ar(i+1)}<input id="name-${i}" type="text" maxlength="32" value="${esc(setup.names[i]||'الفريق '+ar(i+1))}" required></label>`).join('');}
 function updateMode(){setup.mode=document.querySelector('input[name=mode]:checked').value;const active=setup.mode==='teams';document.getElementById('team-config').hidden=!active;document.querySelectorAll('#team-config input').forEach(el=>el.disabled=!active);}
 fields();updateMode();count.addEventListener('input',fields);count.addEventListener('change',fields);document.querySelectorAll('input[name=mode]').forEach(el=>el.addEventListener('change',updateMode));
 document.getElementById('timer-enabled').addEventListener('change',e=>{setup.timer=e.target.checked;document.getElementById('timer-duration').disabled=!setup.timer;});
 document.getElementById('setup-form').addEventListener('submit',e=>{e.preventDefault();const error=document.getElementById('setup-error');error.hidden=true;const isTeams=setup.mode==='teams';const names=isTeams?Array.from(document.querySelectorAll('#team-fields input'),el=>el.value.trim()):['أبطال الصف'];if(names.some(n=>!n)){error.textContent='يرجى كتابة اسم لكل فريق.';error.hidden=false;return;}if(new Set(names).size!==names.length){error.textContent='استخدم اسمًا مختلفًا لكل فريق.';error.hidden=false;return;}setup.names=names.slice();setup.duration=Number(document.getElementById('timer-duration').value)||60;setup.timer=document.getElementById('timer-enabled').checked;game={version:1,teams:names.map(name=>({name})),settings:{...setup,names:names.slice()},index:0,answers:Array(10).fill(null)};persist();enterQuestion();});
}
function enterQuestion(){stopClock();pendingChoice=null;pendingGrade=null;pendingTeam=game.teams.length===1?'0':'';seconds=game.settings.duration;render();const heading=document.getElementById('question-title');if(heading)heading.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function renderSidebar(){const items=scores();const record=currentRecord();const active=record?String(record.team):pendingTeam;return `<aside class="card sidebar" aria-label="لوحة النتائج"><h2>لوحة النتائج</h2><div class="score-list">${items.map(t=>`<div class="score-card ${String(t.id)===active?'active':''}"><div class="score-name">${esc(t.name)}</div><div class="score-bottom"><span class="score-number">${ar(t.points)}<small>نقطة</small></span><span class="score-meta">أسئلة أُجيب عنها: ${ar(t.answered)}</span></div></div>`).join('')}</div><p class="side-note">هذه نقاط كل ${game.teams.length===1?'مجموعة':'فريق'} الفعلية. مجموع درجات أسئلة المسابقة كلها ١٢ درجة.</p>${game.settings.timer?`<section class="timer" aria-label="المؤقت الاختياري"><div class="timer-display" id="timer-display">${formatTime(seconds)}</div><p class="timer-caption" id="timer-caption">مؤقت اختياري بلا خصم نقاط</p><div class="timer-actions"><button type="button" id="timer-toggle" ${record?'disabled':''}>${running?'إيقاف مؤقت':'بدء المؤقت'}</button><button type="button" id="timer-reset" ${record?'disabled':''}>إعادة المؤقت</button></div></section>`:''}</aside>`;}
function renderQuestion(){
 const q=questions[game.index],r=currentRecord(),locked=!!r,scored=r&&r.status==='scored';if(r)pendingTeam=String(r.team);
 app.innerHTML=`<div class="game-grid"><section class="card question-card"><div class="q-top"><span class="counter">السؤال ${ar(q.id)} من ١٠</span><span class="points-tag">${q.points===1?'درجة واحدة':'درجتان'}</span></div><div class="progress-row"><progress aria-label="تقدم المسابقة" max="10" value="${completed()}"></progress><span>أُنجز ${ar(completed())} من ١٠</span></div><h1 class="question-title" id="question-title" tabindex="-1">${esc(q.text)}</h1><div class="answering"><label for="answer-team">${game.teams.length===1?'المجموعة المجيبة':'الفريق المجيب'}</label><select id="answer-team" ${locked||game.teams.length===1?'disabled':''}><option value="">اختر الفريق المجيب</option>${game.teams.map((t,i)=>`<option value="${i}" ${String(i)===pendingTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select><span class="note">${q.type==='mcq'?'اختر إجابة واحدة.':'اذكر عنصرين فقط.'}</span></div>${q.type==='mcq'?renderOptions(q,r):`<div class="list-prompt">أجيبوا شفهيًا أو كتابيًا، ثم ينتقل التصحيح إلى المعلم.</div>`}<div id="feedback-area" aria-live="polite">${r?renderFeedback(q,r):''}</div><div class="action-row">${!r?(q.type==='mcq'?`<button class="btn primary" id="confirm-answer" type="button" ${pendingChoice===null||pendingTeam===''?'disabled':''}>تأكيد الإجابة</button>`:`<button class="btn primary" id="reveal-answer" type="button" ${pendingTeam===''?'disabled':''}>إظهار نموذج الإجابة</button>`):`<span class="waiting">${scored?'تم اعتماد الدرجة لهذا السؤال.':'التصحيح اليدوي للمعلم من ٠ إلى ٢.'}</span>`}<button class="btn secondary" type="button" id="next-question" ${scored?'':'disabled'}>${game.index===9?'عرض النتائج النهائية':'السؤال التالي'} <span aria-hidden="true">←</span></button></div>${!r&&pendingTeam===''?'<p class="note" style="margin-top:9px">اختر الفريق المجيب أولًا.</p>':''}</section>${renderSidebar()}</div>`;
 document.getElementById('answer-team').addEventListener('change',e=>{if(currentRecord())return;pendingTeam=e.target.value;renderQuestion();});
 if(q.type==='mcq')document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{if(currentRecord())return;pendingChoice=Number(btn.dataset.choice);renderQuestion();document.querySelector(`[data-choice="${pendingChoice}"]`).focus();}));
 const confirm=document.getElementById('confirm-answer');if(confirm)confirm.addEventListener('click',()=>{if(currentRecord()||pendingChoice===null||pendingTeam==='')return;stopClock();game.answers[game.index]={team:Number(pendingTeam),choice:pendingChoice,status:'scored',score:pendingChoice===q.correct?1:0};persist();renderQuestion();document.getElementById('next-question').focus({preventScroll:true});});
 const reveal=document.getElementById('reveal-answer');if(reveal)reveal.addEventListener('click',()=>{if(currentRecord()||pendingTeam==='')return;stopClock();game.answers[game.index]={team:Number(pendingTeam),status:'revealed',score:null};persist();renderQuestion();document.querySelector('input[name=grade]').focus({preventScroll:true});});
 document.querySelectorAll('input[name=grade]').forEach(el=>el.addEventListener('change',e=>{pendingGrade=Number(e.target.value);document.getElementById('commit-grade').disabled=false;}));
 const grade=document.getElementById('commit-grade');if(grade)grade.addEventListener('click',()=>{const record=currentRecord();if(!record||record.status!=='revealed'||![0,1,2].includes(pendingGrade))return;record.score=pendingGrade;record.status='scored';persist();renderQuestion();document.getElementById('next-question').focus({preventScroll:true});});
 document.getElementById('next-question').addEventListener('click',()=>{const record=currentRecord();if(!record||record.status!=='scored')return;stopClock();game.index++;persist();enterQuestion();});wireTimer();
}
function renderOptions(q,r){return `<div class="options" role="group" aria-label="بدائل السؤال">${q.options.map((option,i)=>{const selected=r?r.choice===i:pendingChoice===i;const correct=r&&i===q.correct;const wrong=r&&selected&&!correct;const status=correct?'الإجابة الصحيحة':wrong?'إجابة الفريق':'';return `<button class="option ${selected?'selected':''} ${correct?'correct':''} ${wrong?'wrong':''}" type="button" data-choice="${i}" aria-pressed="${selected}" ${r?'disabled':''}><span class="letter">${letters[i]}</span><span class="option-text"><span>${esc(option)}</span>${status?`<span class="option-status">${status}</span>`:''}</span></button>`;}).join('')}</div>`;}
function renderFeedback(q,r){if(q.type==='mcq')return `<div class="feedback ${r.score===0?'is-wrong':''}"><p class="feedback-title">${r.score===1?'إجابة صحيحة! أُضيفت نقطة.':'لنتعلّم من الإجابة. لم تُضف نقاط.'}</p><p><strong>الإجابة الصحيحة: ${letters[q.correct]}. ${esc(q.options[q.correct])}</strong></p><p>${esc(q.explanation)}</p></div>`;return `<div class="feedback"><p class="feedback-title">نموذج الإجابة</p><p>تُقبل إجابتان مختلفتان من الآتي:</p><div class="accepted">${q.accepted.map(s=>`<span>${esc(s)}</span>`).join('')}</div><p class="rubric">${esc(q.rubric)} تُقبل الصياغة المكافئة، ولا يُخصم لخطأ إملائي بسيط لا يغيّر المعنى.</p>${r.status==='scored'?`<p class="feedback-title" style="margin-top:10px">الدرجة المعتمدة: ${ar(r.score)} من ٢</p>`:`<fieldset class="grade-box"><legend>درجة السؤال يحددها المعلم</legend><div class="grade-buttons">${[0,1,2].map(n=>`<label class="grade-label"><input type="radio" name="grade" value="${n}" ${pendingGrade===n?'checked':''}>${ar(n)} من ٢</label>`).join('')}</div><button type="button" class="btn primary grade-commit" id="commit-grade" ${pendingGrade===null?'disabled':''}>اعتماد الدرجة</button></fieldset>`}</div>`;}
function renderResults(){stopClock();const list=scores().sort((a,b)=>b.points-a.points||a.id-b.id);const top=list[0].points;const winners=list.filter(t=>t.points===top);const headline=game.teams.length===1?'أحسنتم يا أبطال الصف':winners.length===1?'الفريق الفائز':'انتهت المسابقة بالتعادل';const winnerText=game.teams.length===1?`نقاط الصف: ${ar(top)} من ١٢`:winners.map(t=>esc(t.name)).join(' و ');app.innerHTML=`<section class="card results"><div class="result-hero"><div class="trophy" aria-hidden="true">${winners.length===1?'🏆':'⭐'}</div><span class="tag">اكتملت الأسئلة العشرة</span><h1 tabindex="-1" id="results-title">${headline}</h1><p class="winner">${winnerText}</p><p class="result-caption">${game.teams.length===1?'شكرًا لتعاونكم ومشاركتكم.':'تُعرض النقاط الفعلية لكل فريق حسب الأسئلة التي أجاب عنها.'}</p></div><table class="result-table"><thead><tr><th scope="col">${game.teams.length===1?'المجموعة':'الفريق'}</th><th scope="col">النقاط</th><th scope="col">الأسئلة المُجاب عنها</th></tr></thead><tbody>${list.map(t=>`<tr class="${t.points===top?'leader':''}"><td>${esc(t.name)}</td><td>${ar(t.points)}</td><td>${ar(t.answered)}</td></tr>`).join('')}</tbody></table><p class="note" style="margin-top:16px">مجموع درجات المسابقة كلها ١٢ درجة. الاختياري درجة واحدة، والتعداد درجتان لكل سؤال.</p><div class="result-actions"><button class="btn primary" id="play-again" type="button">إعادة بدء المسابقة</button></div></section>`;document.getElementById('play-again').addEventListener('click',showReset);document.getElementById('results-title').focus({preventScroll:true});}
function formatTime(s){return ar(Math.floor(s/60))+':'+ar(String(s%60).padStart(2,'0'));}
function updateClock(){const display=document.getElementById('timer-display'),caption=document.getElementById('timer-caption'),toggle=document.getElementById('timer-toggle');if(display)display.textContent=formatTime(seconds);if(toggle)toggle.textContent=running?'إيقاف مؤقت':seconds===0?'انتهى المؤقت':seconds<game.settings.duration?'استئناف المؤقت':'بدء المؤقت';if(caption)caption.textContent=seconds===0?'انتهى الوقت. يمكن متابعة الإجابة.':'مؤقت اختياري بلا خصم نقاط';if(toggle)toggle.disabled=!!currentRecord()||seconds===0;}
function wireTimer(){if(!game.settings.timer)return;const toggle=document.getElementById('timer-toggle'),reset=document.getElementById('timer-reset');if(toggle)toggle.addEventListener('click',()=>{if(currentRecord())return;if(running)stopClock();else if(seconds>0){running=true;clock=setInterval(()=>{seconds=Math.max(0,seconds-1);if(seconds===0)stopClock();updateClock();},1000);}updateClock();});if(reset)reset.addEventListener('click',()=>{if(currentRecord())return;stopClock();seconds=game.settings.duration;updateClock();});updateClock();}
function showReset(){if(!game)return;lastFocus=document.activeElement;stopClock();overlay.hidden=false;document.getElementById('reset-cancel').focus();}
function hideReset(){overlay.hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();if(game&&game.index<10&&game.settings.timer)updateClock();}
resetButton.addEventListener('click',showReset);document.getElementById('reset-cancel').addEventListener('click',hideReset);document.getElementById('reset-confirm').addEventListener('click',()=>{stopClock();setup={...game.settings,names:game.settings.names.slice()};game=null;pendingTeam='';pendingChoice=null;pendingGrade=null;persist();overlay.hidden=true;render();document.querySelector('input[name=mode]').focus({preventScroll:true});});
overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();hideReset();}if(e.key==='Tab'){const first=document.getElementById('reset-cancel'),last=document.getElementById('reset-confirm');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('fullscreen').textContent='استخدم تكبير المتصفح';}});document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'إنهاء ملء الشاشة':'ملء الشاشة';});
if(game&&game.teams.length===1)pendingTeam='0';
render();
})();
</script>
</body>
